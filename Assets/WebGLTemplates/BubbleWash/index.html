<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
        background: linear-gradient(180deg, #9eb8ff 0%, #ffd1f2 55%, #8cc7ff 100%); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      /* Portrait phone shape on desktop; full screen on phones. */
      #unity-canvas { display: block; height: 100vh; height: 100dvh; aspect-ratio: 9 / 19.5; max-width: 100vw;
        background: #1b3a9e; outline: none; border-radius: 0; box-shadow: 0 0 40px rgba(40, 30, 120, 0.35); touch-action: none; }
      body.mobile #unity-canvas { width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; box-shadow: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #fff; text-shadow: 0 2px 0 #142a7a; pointer-events: none; }
      #loading h1 { margin: 0; font-size: 34px; letter-spacing: 0.5px; }
      #bar { width: min(70vw, 320px); height: 18px; border-radius: 9px; background: rgba(16, 32, 100, 0.55); border: 2px solid #cfe8ff; overflow: hidden; }
      #fill { height: 100%; width: 0%; background: linear-gradient(180deg, #9ff57a, #2dbe46); transition: width 0.2s; }
      #status { font-size: 15px; opacity: 0.9; }
      #error { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none; padding: 12px 14px; border-radius: 10px;
        background: rgba(120, 0, 40, 0.88); color: #fff; font-size: 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <h1>Bubble Wash Kingdom</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading the washing machine...</div>
    </div>
    <div id="error"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) document.body.classList.add("mobile");
      var canvas = document.querySelector("#unity-canvas");
      // Keep swipes inside the game (no page scrolling / pull-to-refresh / zoom).
      ["touchstart", "touchmove", "gesturestart"].forEach(function (e) {
        canvas.addEventListener(e, function (ev) { ev.preventDefault(); }, { passive: false });
      });
      function showError(message) {
        var el = document.getElementById("error");
        el.textContent = "Bubble Wash Kingdom could not start: " + message;
        el.style.display = "block";
      }
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Cap the render resolution on very high-DPI phones to keep the frame rate up.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        document.getElementById("loading").style.display = "none";
        showError(message);
      });
    </script>
  </body>
</html>
