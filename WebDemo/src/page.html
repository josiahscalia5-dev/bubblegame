<title>Bubble Wash Kingdom Screen 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* Layout: one portrait game screen, the approved 1:2 Screen 3 proportion, centred; the HUD is laid out
     in "board pixels" of the approved crop (1 px = screen height / 537), so it scales like the original. */
  :root {
    color-scheme: dark;
    --night: #241a52;          /* the stage surround: deep violet of the drum at night */
    --night-2: #3b2a86;
    --pill: rgba(20, 28, 92, 0.72);
    --panel-top: #4fb3ff;
    --panel-bot: #1d63e6;
    --panel-rim: rgba(255, 255, 255, 0.9);
    --ink: #0f1f6b;            /* text outline */
    --white: #ffffff;
    --pink: #ff4fb8;
    --display: "Fredoka", "Baloo 2", "Nunito", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 20%, var(--night-2), var(--night));
    color: var(--white);
    font-family: var(--display);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: relative;
    height: min(100%, 100dvh);
    aspect-ratio: 1 / 2;
    max-width: 100%;
    max-height: 100%;
    border-radius: calc(var(--u, 1px) * 14);
    overflow: hidden;
    touch-action: none;
    background: #cbb7ff;
    box-shadow: 0 0 0 calc(var(--u, 1px) * 2) rgba(255, 255, 255, 0.35), 0 calc(var(--u, 1px) * 10) calc(var(--u, 1px) * 40) rgba(0, 0, 0, 0.45);
  }
  @media (max-aspect-ratio: 3/5) { #stage { aspect-ratio: auto; width: 100%; height: 100%; border-radius: 0; box-shadow: none; } }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; inset: 0; pointer-events: none; font-size: calc(var(--u) * 15); }
  .hud > * { position: absolute; }
  .t { font-weight: 700; color: var(--white); text-shadow: 0 0 calc(var(--u) * 1.5) var(--ink), 0 calc(var(--u) * 1.3) 0 var(--ink), calc(var(--u) * 1.2) 0 0 var(--ink), calc(var(--u) * -1.2) 0 0 var(--ink), 0 calc(var(--u) * -1.1) 0 var(--ink), 0 calc(var(--u) * 2.4) calc(var(--u) * 1.5) rgba(8, 20, 90, 0.55); }
  .pill {
    top: calc(var(--u) * var(--y)); left: calc(var(--u) * var(--x)); width: calc(var(--u) * var(--w)); height: calc(var(--u) * var(--h));
    border-radius: 999px; background: var(--pill); box-shadow: inset 0 0 0 calc(var(--u) * 1.2) rgba(140, 200, 255, 0.55);
    display: flex; align-items: center;
  }
  .pill img { position: absolute; }
  .pill span { position: absolute; left: calc(var(--u) * var(--tx)); line-height: 1; font-variant-numeric: tabular-nums; }
  .pill small { font-size: calc(var(--u) * 11); }
  #gemPill.pop img, #gemPill.pop span { animation: pop 0.42s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 40% { transform: scale(1.4) rotate(-8deg); } 100% { transform: none; } }
  .round {
    pointer-events: auto; top: calc(var(--u) * 12); left: calc(var(--u) * 226); width: calc(var(--u) * 27); height: calc(var(--u) * 27);
    border-radius: 50%; border: calc(var(--u) * 1.5) solid var(--panel-rim); padding: 0; cursor: pointer;
    background: radial-gradient(circle at 40% 30%, var(--panel-top), var(--panel-bot));
    display: grid; place-items: center;
  }
  .round img { width: 70%; height: 70%; }
  .round[aria-pressed="true"] img { opacity: 0.45; }
  .round:focus-visible { outline: calc(var(--u) * 2) solid #ffe27a; outline-offset: calc(var(--u) * 1); }
  .panel {
    left: 50%; transform: translateX(-50%);
    border-radius: calc(var(--u) * 22);
    /* Glossy jelly panel, as in the approved screens: deep royal blue, a bright sheen across the top,
       a thick pale-cyan rim with a soft outer glow, and a darker inner edge at the bottom. */
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.12) 22%, rgba(255, 255, 255, 0) 38%),
      radial-gradient(120% 90% at 50% 0%, #4aa6ff 0%, #2a74f4 45%, #1446d2 100%);
    box-shadow:
      inset 0 0 0 calc(var(--u) * 2.6) rgba(190, 236, 255, 0.95),
      inset 0 calc(var(--u) * -6) calc(var(--u) * 10) rgba(8, 22, 120, 0.45),
      0 0 calc(var(--u) * 7) rgba(150, 215, 255, 0.85),
      0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(20, 30, 120, 0.35);
    text-align: center;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  #banner { top: calc(var(--u) * 82); width: calc(var(--u) * 205); height: calc(var(--u) * 70); }
  #banner .big { position: absolute; left: 0; right: 0; top: calc(var(--u) * 5); font-size: calc(var(--u) * 30); line-height: calc(var(--u) * 36); }
  #banner .small { position: absolute; left: 0; right: 0; top: calc(var(--u) * 39); font-size: calc(var(--u) * 16); line-height: calc(var(--u) * 24); font-weight: 600; }
  #startPanel { bottom: calc(var(--u) * 28); width: calc(var(--u) * 237); height: calc(var(--u) * 100); }
  #startPanel .l { position: absolute; left: 0; right: 0; font-size: calc(var(--u) * 17.5); line-height: calc(var(--u) * 22); font-weight: 700; }
  #startPanel .tap { font-size: calc(var(--u) * 19); line-height: calc(var(--u) * 26); font-weight: 700; }
  #startPanel img { position: absolute; }
  #hand { animation: hover 1.1s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translateY(calc(var(--u) * -3)); } }
  body.running #banner, body.running #startPanel { opacity: 0; transform: translateX(-50%) translateY(calc(var(--u) * 12)); }
  #hint {
    left: 50%; bottom: calc(var(--u) * 26); transform: translateX(-50%); width: max-content; max-width: 88%; text-align: center;
    padding: calc(var(--u) * 5) calc(var(--u) * 12); border-radius: calc(var(--u) * 12); background: var(--pill);
    font-size: calc(var(--u) * 11); line-height: 1.35; opacity: 0; transition: opacity 0.4s ease;
  }
  #hint.show { opacity: 1; }
  /* Approved Screen 4 objective panel: shown once the mascot is inside the washing machine. */
  #sockPanel {
    top: calc(var(--u) * 46); left: calc(var(--u) * 14); width: calc(var(--u) * 200); height: calc(var(--u) * 46);
    border-radius: calc(var(--u) * 15); opacity: 0; transform: translateY(calc(var(--u) * -10));
  }
  body.inDrum #sockPanel { opacity: 1; transform: none; }
  #sockPanel .icon { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 1); width: calc(var(--u) * 44); height: calc(var(--u) * 44); }
  #sockPanel .title { position: absolute; left: calc(var(--u) * 50); top: calc(var(--u) * 5); font-size: calc(var(--u) * 14.5); line-height: calc(var(--u) * 18); white-space: nowrap; }
  #sockPanel .track { position: absolute; left: calc(var(--u) * 52); top: calc(var(--u) * 28); width: calc(var(--u) * 106); height: calc(var(--u) * 9); border-radius: 999px; background: rgba(20, 28, 92, 0.55); box-shadow: inset 0 0 0 calc(var(--u) * 1) rgba(255, 255, 255, 0.6); overflow: hidden; }
  #sockBar { height: 100%; width: 0; background: linear-gradient(90deg, #ffe27a, #ff8fd8); transition: width 0.3s ease; }
  #sockPanel .count { position: absolute; left: calc(var(--u) * 163); top: calc(var(--u) * 24); font-size: calc(var(--u) * 14); line-height: 1; }
  #sockPanel.pop .icon { animation: pop 0.42s cubic-bezier(.2, 1.6, .4, 1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Side view (debug): full window, no game HUD. */
  body.side { padding: 0; }
  body.side #stage { aspect-ratio: auto; width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
  body.side .hud { display: none; }
  #flash { inset: 0; background: radial-gradient(circle, rgba(255, 255, 255, 0.95), rgba(220, 200, 255, 0.85)); opacity: 0; }
  #flash.go { animation: flash 0.7s ease-out; }
  @keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
  #loading {
    position: absolute; inset: 0; display: grid; place-content: center; gap: calc(var(--u, 1px) * 10); text-align: center;
    background: radial-gradient(circle at 50% 35%, #ffd6f3, #b9a3ff 55%, #6f8cff);
    padding: calc(var(--u, 1px) * 20);
  }
  #loading h1 { margin: 0; font-size: calc(var(--u, 1px) * 26); text-wrap: balance; }
  #loading p { margin: 0; font-size: calc(var(--u, 1px) * 12); font-weight: 500; max-width: 30ch; }
  .bar { width: calc(var(--u, 1px) * 180); height: calc(var(--u, 1px) * 10); border-radius: 999px; background: rgba(20, 28, 92, 0.35); overflow: hidden; margin-inline: auto; }
  #loadBar { height: 100%; width: 0; background: linear-gradient(90deg, #ffe27a, #ff8fd8); transition: width 0.2s ease; }
  @media (prefers-reduced-motion: reduce) { #hand { animation: none; } .panel { transition: none; } }
</style>

<div id="stage">
  <canvas id="view" aria-label="Bubble Wash Kingdom: the pink mascot rides the water slide into the washing machine"></canvas>
  <div class="hud" aria-live="polite">
    <div class="pill t" style="--x:12;--y:13;--w:70;--h:23;--tx:28">
      <img src="ui/heart.png" alt="" style="left:calc(var(--u)*-4);top:calc(var(--u)*-2);width:calc(var(--u)*27);height:calc(var(--u)*26)">
      <span>5 <small>Full</small></span>
      <img src="ui/plus.png" alt="" style="left:calc(var(--u)*58);top:calc(var(--u)*5);width:calc(var(--u)*13);height:calc(var(--u)*13)">
    </div>
    <div class="pill t" style="--x:92;--y:14;--w:67;--h:22;--tx:25">
      <img src="ui/coin.png" alt="Coins" style="left:calc(var(--u)*-1);top:calc(var(--u)*-2);width:calc(var(--u)*25);height:calc(var(--u)*25)">
      <span id="coins">1,280</span>
    </div>
    <div class="pill t" id="gemPill" style="--x:166;--y:14;--w:57;--h:22;--tx:31">
      <img src="ui/gem.png" alt="Gems" style="left:0;top:calc(var(--u)*-2);width:calc(var(--u)*27);height:calc(var(--u)*25)">
      <span id="gems">36</span>
    </div>
    <button class="round" id="soundBtn" type="button" title="Sound on" aria-pressed="false" aria-label="Sound on or off">
      <img src="ui/gear.png" alt="">
    </button>
    <div class="panel t" id="banner"><div class="big">Let's go!</div><div class="small">Into the washing machine!</div></div>
    <div class="panel t" id="startPanel">
      <div class="l" style="top:calc(var(--u)*9)">Swipe Left or Right</div>
      <div class="l" style="top:calc(var(--u)*27)">to Move</div>
      <div class="l tap" style="top:calc(var(--u)*50)">Tap to Start</div>
      <img src="ui/arrow_left.png" alt="" style="left:calc(var(--u)*10);top:calc(var(--u)*31);width:calc(var(--u)*40);height:calc(var(--u)*45);filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*1.5) rgba(10,30,120,.5))">
      <img src="ui/arrow_right.png" alt="" style="left:calc(var(--u)*187);top:calc(var(--u)*31);width:calc(var(--u)*40);height:calc(var(--u)*45);filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*1.5) rgba(10,30,120,.5))">
      <img id="hand" src="ui/hand.png" alt="" style="left:calc(var(--u)*99);top:calc(var(--u)*66);width:calc(var(--u)*40);height:calc(var(--u)*50);filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*1.5) rgba(10,30,120,.5))">
    </div>
    <div class="panel t" id="sockPanel">
      <img class="icon" src="ui/sock.png" alt="">
      <div class="title">Rescue 5 lost socks</div>
      <div class="track"><div id="sockBar"></div></div>
      <div class="count" id="sockCount">0/5</div>
    </div>
    <div class="t" id="hint">Swipe ← → to steer · ↑ to jump<br>Tap to spin</div>
    <div id="flash"></div>
  </div>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <div id="loading">
    <h1 class="t">Bubble Wash Kingdom</h1>
    <div class="bar"><div id="loadBar"></div></div>
    <p class="t" id="loadMsg">Filling the washing machine… <span id="loadPct">0%</span></p>
  </div>
</div>
<script type="module" src="game.bundle.js"></script>
