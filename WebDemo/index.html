  /* Layout: one portrait game screen, the approved 1:2 Screen 3 proportion, centred; the HUD is laid out

    padding-right: max(16px, env(safe-area-inset-right, 0px));

  /* ?s3=match only (match_phone.js): on a phone the game fills the screen edge to edge, without the 16 px side padding or
     the browser's default 8 px body margin (which also pushed the stage 8 px down, past the bottom of the screen) */
